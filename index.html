<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sourceword</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Sourceword</h1>
      <p class="source">Source word: <strong id="source"></strong></p>
    </header>

    <form id="guess-form" autocomplete="off">
      <input id="guess" type="text" inputmode="text" autocapitalize="off" spellcheck="false" aria-label="Your word" placeholder="Type a word">
      <button type="submit">Enter</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <section>
      <p class="score">Score: <strong id="score">0</strong></p>
      <h2>Found (<span id="count">0</span>)</h2>
      <ul id="found"></ul>
    </section>

    <footer>
      <span class="build">build 0.1.0-b1</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17142A">
  <title>Sourceword</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="top">
        <span id="date" class="date"></span>
        <span class="build" id="build"></span>
      </div>
      <div class="titlebar">
        <h1>Sourceword</h1>
        <div class="goal" role="group" aria-label="Goal">
          <button type="button" class="seg" id="goal-all" aria-pressed="true">All words</button>
          <button type="button" class="seg" id="goal-ten" aria-pressed="false">10 per length</button>
        </div>
      </div>
      <p class="source"><strong id="source"></strong></p>
    </header>

    <form id="guess-form" autocomplete="off">
      <input id="guess" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus aria-label="Your word" placeholder="Type a word">
      <button type="submit">Enter</button>
      <button type="button" id="finish" class="secondary">I'm done</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <section>
      <div class="score-row">
        <p class="score">Score <strong id="score">0</strong></p>
        <p class="rank" id="rank"></p>
      </div>
      <div class="found-head">
        <h2>Found <span id="count">0</span></h2>
        <p class="countdown" id="countdown"></p>
      </div>
      <p class="lengths" id="lengths"></p>
      <ul id="found" class="chips"></ul>
      <h2>Bonuses</h2>
      <ul id="bonuses" class="chips"></ul>
    </section>

    <section id="debug" hidden>
      <h2>Test view</h2>
      <p id="debug-summary" class="debug-summary"></p>
      <p class="debug-actions">
        <button type="button" id="reveal" class="secondary">Show all words</button>
        <button type="button" id="reset" class="secondary">Reset today</button>
      </p>
      <div id="debug-words"></div>
    </section>

    <footer>
      <a class="brand" href="https://froobaloo.com/">froobaloo</a>
      <button type="button" id="admin-toggle" class="secondary admin-toggle">Admin: off</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>

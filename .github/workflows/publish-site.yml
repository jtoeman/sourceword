name: Publish to Froobaloo

# Sourceword is served at https://froobaloo.com/sourceword/ by the jtoeman/froobaloo hub repo,
# which copies this repo's files straight from `main`. This asks the hub to rebuild after each
# push, so changes go live in a couple of minutes.
#
# Needs one repository secret, DEPLOY_TOKEN: a fine-grained token with Contents: read and write on
# jtoeman/froobaloo, used only to send the game-updated ping.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the Froobaloo hub to rebuild
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: gh api repos/jtoeman/froobaloo/dispatches -f event_type=game-updated -f "client_payload[game]=sourceword"
